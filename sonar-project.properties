sonar.projectKey=metadatastician_authority-watch
sonar.organization=metadatastician

# Path is relative to the sonar-project.properties file.
sonar.sources=.

# Encoding of the source code. Default is default system encoding
sonar.sourceEncoding=UTF-8

# ----------------------------------------------------------------
# EXTERNAL OPEN-SOURCE ANALYZER REPORTS
# ----------------------------------------------------------------
sonar.css.stylelint.reportPaths=stylelint-report.json
sonar.docker.hadolint.reportPaths=hadolint-report.txt
sonar.githubactions.actionlint.reportPaths=actionlint-report.json
sonar.eslint.reportPaths=eslint-report.json
sonar.terraform.tflint.reportPaths=tflint-report.json
sonar.yaml.spectral.reportPaths=spectral-report.json
