name: Build
on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]
jobs:
  sonarqube:
    name: SonarQube
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis
          
      - name: Cache SonarQube packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Run External Linters
        run: |
          # 1. Install CLI tools globally via npm
          npm install -g stylelint stylelint-config-standard eslint @stoplight/spectral-cli
          
          # 2. Install Actionlint and TFLint using setup scripts
          bash <(curl -sfL https://githubusercontent.com)
          curl -s https://githubusercontent.com | bash
          
          # 3. Run Web Linters (JavaScript, CSS, OpenAPI)
          # '|| true' ensures the pipeline keeps running even if a linter finds errors
          eslint . --format json --output-file eslint-report.json || true
          stylelint "**/*.{css,scss,less}" -f json -o stylelint-report.json || true
          
          # If your file name is different (e.g., swagger.yaml), change 'openapi.yaml' here
          if [ -f openapi.yaml ]; then
            spectral lint openapi.yaml -f json -o spectral-report.json || true
          else
            echo "{}" > spectral-report.json
          fi
          
          # 4. Run Dockerfile Linter (Hadolint) using Docker
          # If your file name is 'Containerfile', change 'Dockerfile' below to match it
          if [ -f Dockerfile ]; then
            docker run --rm -i ghcr.io/hadolint/hadolint < Dockerfile > hadolint-report.txt || true
          else
            touch hadolint-report.txt
          fi
          
          # 5. Run GitHub Actions / DevOps Linters
          ./actionlint -format '{{json .}}' > actionlint-report.json || true
          tflint --format=json > tflint-report.json || true

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
